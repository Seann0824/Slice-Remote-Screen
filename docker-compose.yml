services:
  signaling:
    build:
      context: .
      dockerfile: apps/signaling-server/Dockerfile
      args:
        VITE_SIGNALING_SERVER: ${VITE_SIGNALING_SERVER:-}
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      SIGNALING_HOST: 0.0.0.0
      SIGNALING_PORT: 8787
      SIGNALING_DATA_FILE: /data/device.json
    volumes:
      - signaling-data:/data
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    env_file:
      - .env.server
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      turnserver --no-cli --no-tls --no-dtls --fingerprint --lt-cred-mech
      --use-auth-secret --static-auth-secret="$${TURN_SECRET}"
      --realm="$${TURN_REALM:-slice.example.com}"
      --external-ip="$${TURN_EXTERNAL_IP}"
      --min-port=49160 --max-port=49260
    ports:
      - "3478:3478/udp"
      - "49160-49260:49160-49260/udp"

volumes:
  signaling-data:
